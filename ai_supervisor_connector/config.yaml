name: AI Supervisor V5 Connector
version: "5.0.0-alpha8"
slug: ai_supervisor_connector
description: Safe Home Assistant connector for the split AI Supervisor V5 engine running on a Windows mini PC
url: https://github.com/vaitkus82-cpu/ha-ai-supervisor-v5/tree/main/ai_supervisor_connector
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-industrial-outline
panel_title: AI Supervisor V5
panel_admin: true
watchdog: http://[HOST]:[PORT:8099]/health
homeassistant: 2026.7.0
homeassistant_api: true
hassio_api: true
hassio_role: manager
stage: experimental
options:
  language: lt
  engine_url: ""
  engine_token: ""
  allow_package_writes: false
  max_snapshot_mb: 8
schema:
  language: list(lt|en)
  engine_url: str
  engine_token: password
  allow_package_writes: bool
  max_snapshot_mb: int(2,20)
map:
  - type: homeassistant_config
    read_only: false
